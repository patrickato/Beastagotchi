name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prepare Beastagotchi runtime state directories
        run: sudo install -d -o "$USER" -g "$USER" /var/lib/beastagotchi /var/lib/beastagotchi/secrets /var/lib/beastagotchi/ui

      - name: Unit and regression tests
        run: PYTHONPATH=. pytest -q

      - name: Compile Python
        run: python -m compileall -q beastcore beastui beaststudio

      - name: Shell syntax
        run: bash -n install.sh install_ui.sh install_bridge.sh remove_bridge.sh uninstall.sh validate_v018.sh tools/v019_physical_acceptance.sh


      - name: Render sanitized real-state UX gallery
        run: |
          mkdir -p artifacts/v019-real-state-gallery
          PYTHONPATH=. python tools/render_v019_ux_gallery.py             --root beastui             --state tests/fixtures/v018_target_sanitized_state.json             --out artifacts/v019-real-state-gallery             --all-themes

      - name: Upload v0.19 real-state UX gallery
        uses: actions/upload-artifact@v4
        with:
          name: v019-real-state-ux-gallery
          path: artifacts/v019-real-state-gallery
          if-no-files-found: error
          retention-days: 30


      - name: Build commit-pinned v0.19 Pi acceptance source bundle
        run: |
          mkdir -p artifacts/v019-pi-acceptance
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ARCHIVE="artifacts/v019-pi-acceptance/beastagotchi-v019-pi-acceptance-${SHORT_SHA}.tar.gz"
          git archive --format=tar.gz --prefix="Beastagotchi-v019-${SHORT_SHA}/" -o "$ARCHIVE" HEAD
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          printf '%s\n' "$GITHUB_SHA" > artifacts/v019-pi-acceptance/COMMIT_SHA.txt

      - name: Upload v0.19 Pi acceptance source bundle
        uses: actions/upload-artifact@v4
        with:
          name: v019-pi-acceptance-source
          path: artifacts/v019-pi-acceptance
          if-no-files-found: error
          retention-days: 30
