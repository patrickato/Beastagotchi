name: repository-bootstrap

on:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/repository-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct validated source tree
        shell: bash
        run: |
          cat .bootstrap/seed.part.* > /tmp/beastagotchi-seed.b64
          base64 -d /tmp/beastagotchi-seed.b64 > /tmp/beastagotchi-seed.tar.xz
          tar -xJf /tmp/beastagotchi-seed.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/tests.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate reconstructed repository
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          sudo install -d -o "$USER" -g "$USER" /var/lib/beastagotchi /var/lib/beastagotchi/secrets /var/lib/beastagotchi/ui
          PYTHONPATH=. pytest -q
          python -m compileall -q beastcore beastui beaststudio
          bash -n install.sh install_ui.sh install_bridge.sh remove_bridge.sh uninstall.sh validate_v018.sh
          find . -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit validated repository tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap validated Beastagotchi v0.18.1 repository"
          git push origin HEAD:main
